<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f0e8">
  <title>Artist portfolio</title>
  <style>
    :root { color-scheme: light; background: #f4f0e8; color: #33313a; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Georgia, 'Times New Roman', serif; }
    .page { width: min(100% - 48px, 1240px); margin: 0 auto; padding: 32px 0 40px; }
    .artwork { margin: 0 auto; max-width: 1200px; width: 100%; box-shadow: 0 17px 43px #4134441a, 0 1px 4px #41344420; }
    .artwork img { display: block; width: 100%; height: auto; }
    @media (max-width: 600px) {
      .page { width: min(100% - 28px, 1240px); padding: 21px 0 28px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <figure class="artwork">
      <picture>
        <source srcset="whimsical_girl_loop_v2_still.png" type="image/png" media="(prefers-reduced-motion: reduce)">
        <source srcset="whimsical_girl_loop_v2.webp" type="image/webp">
        <img src="whimsical_girl_loop_v2.gif"
             alt="Watercolour illustration of a whimsical girl winking as her hair drifts in a breeze, with swirling spirals and blinking circles around her"
             width="1200" height="885" loading="lazy" decoding="async">
      </picture>
    </figure>
  </main>
</body>
</html>
