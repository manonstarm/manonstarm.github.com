<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f0e8">
  <title>Whimsical girl — Manon Spruth</title>
  <style>
    :root { color-scheme: light; background: #f4f0e8; color: #33313a; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Georgia, 'Times New Roman', serif; }
    .page { width: min(100% - 48px, 1240px); margin: 0 auto; padding: 32px 0 40px; }
    header { display: flex; justify-content: space-between; align-items: baseline; gap: 24px; border-bottom: 1px solid #d5cdbf; padding-bottom: 18px; }
    .name { font-size: clamp(1.15rem, 2.3vw, 1.55rem); letter-spacing: -.035em; }
    .eyebrow, .index, figcaption { font-family: Arial, Helvetica, sans-serif; font-size: .68rem; letter-spacing: .18em; text-transform: uppercase; }
    .eyebrow { color: #72687b; }
    .intro { display: flex; align-items: end; justify-content: space-between; gap: 20px; padding: 31px 0 24px; }
    h1 { font-size: clamp(2.25rem, 5vw, 4.6rem); line-height: .98; font-weight: 400; letter-spacing: -.055em; margin: 0; }
    .index { color: #806f88; white-space: nowrap; padding-bottom: 5px; }
    figure { margin: 0; }
    .artwork { position: relative; width: 100%; overflow: hidden; aspect-ratio: 2004 / 1479; background: #d8d5d1; box-shadow: 0 17px 43px #4134441a, 0 1px 4px #41344420; }
    .artwork img, .artwork svg { display: block; width: 100%; height: 100%; }
    .artwork img { position: relative; object-fit: contain; }
    .artwork svg { position: absolute; inset: 0; pointer-events: none; }
    .spiral { animation: spin 7s linear infinite; transform-box: fill-box; transform-origin: center; }
    .spiral.slow { animation-duration: 10s; animation-direction: reverse; }
    .orbit { animation: orbit 9s linear infinite; transform-box: fill-box; transform-origin: center; }
    .blink { animation: blink 2.4s steps(1, end) infinite; }
    .blink.late { animation-delay: -1.2s; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes orbit { to { transform: rotate(-360deg); } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    figcaption { display: flex; justify-content: space-between; gap: 15px; color: #756d75; padding-top: 17px; line-height: 1.5; }
    @media (max-width: 600px) {
      .page { width: min(100% - 28px, 1240px); padding: 21px 0 28px; }
      header { padding-bottom: 14px; }
      .eyebrow { font-size: .59rem; letter-spacing: .11em; }
      .intro { padding: 25px 0 18px; }
      .index { display: none; }
      figcaption { font-size: .57rem; letter-spacing: .11em; }
    }
    @media (prefers-reduced-motion: reduce) {
      .spiral, .orbit, .blink { animation: none; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <span class="name">Manon Spruth</span>
      <span class="eyebrow">Illustration / motion study</span>
    </header>
    <div class="intro">
      <h1>Whimsical girl</h1>
      <span class="index">Animated study · 01</span>
    </div>
    <figure>
      <div class="artwork">
        <img src="whimsicle_girl.jpg" width="2004" height="1479" alt="Pencil portrait of a girl with curling hair and ram-like horns, surrounded by lilac and gold spirals and circles.">
        <!-- Coordinates follow the original 2004 × 1479 drawing; only these added motifs move. -->
        <svg viewBox="0 0 2004 1479" preserveAspectRatio="xMidYMid meet" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <path id="curl" d="M 0,-49 C 32,-49 49,-24 48,2 C 47,34 20,51 -9,42 C -33,35 -38,8 -23,-8 C -11,-22 13,-17 17,0 C 20,13 10,20 0,16 C -9,12 -7,3 -2,2" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
          </defs>
          <g class="spiral" data-motion="spiral" style="color:#837087">
            <circle cx="83" cy="81" r="63" fill="#e3dedb" fill-opacity=".82"/>
            <use href="#curl" x="83" y="81"/>
          </g>
          <g class="spiral slow" data-motion="spiral" style="color:#927b94">
            <circle cx="367" cy="305" r="72" fill="#e0d9d9" fill-opacity=".75"/>
            <use href="#curl" x="367" y="305" transform="translate(367 305) scale(1.13) translate(-367 -305)"/>
          </g>
          <g class="orbit" data-motion="orbit" fill="none" stroke="#a38aab" stroke-width="3" stroke-opacity=".75">
            <circle cx="229" cy="456" r="101" stroke-dasharray="4 10"/>
            <circle cx="229" cy="456" r="70" stroke="#b8a764" stroke-opacity=".58" stroke-width="2"/>
            <circle cx="229" cy="355" r="12" fill="#9a7c9e" stroke="none"/>
            <circle cx="322" cy="416" r="7" fill="#b0a066" stroke="none"/>
            <circle cx="183" cy="545" r="5" fill="#9a7c9e" stroke="none"/>
          </g>
          <circle class="blink" data-motion="blink" cx="119" cy="528" r="22" fill="#8f7190" fill-opacity=".9"/>
          <circle class="blink late" data-motion="blink" cx="442" cy="484" r="15" fill="#a58aa6" fill-opacity=".9"/>
        </svg>
      </div>
      <figcaption><span>Original drawing with animated overlays</span><span>Spirals · circles · still portrait</span></figcaption>
    </figure>
  </main>
</body>
</html>
